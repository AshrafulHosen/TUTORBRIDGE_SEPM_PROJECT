spring:
  application:
    name: tutorbridge
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  zone: Asia/Dhaka
  jwt:
    secret: ${JWT_SECRET}
    issuer: tutorbridge
    ttl-minutes: 60
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  error:
    include-message: never
    include-stacktrace: never
